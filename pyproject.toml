[project]
name = "local-dev-agent"
version = "0.1.0"
description = "Safe local development environment and port coordination agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "docker>=7.1",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "structlog>=24.4",
  "typer>=0.15",
  "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]
mcp = ["mcp>=1.2"]

[project.scripts]
dev-agent = "dev_agent.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "-p", "no:launch", "-p", "no:launch_ros",
  "-p", "no:ament_xmllint", "-p", "no:ament_pep257",
  "-p", "no:ament_flake8", "-p", "no:ament_copyright", "-p", "no:ament_lint",
]
markers = ["docker: requires a live Docker daemon"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'docs/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-ci:
    name: Python Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check code formatting (Ruff)
        run: uv run ruff format --check .

      - name: Run linter (Ruff)
        run: uv run ruff check .

      - name: Run unit & integration tests (pytest)
        run: uv run pytest -m "not docker"

  ui-build:
    name: Web UI Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install UI dependencies
        run: cd src/arbiter/ui && npm install

      - name: Build static UI bundle
        run: cd src/arbiter/ui && npm run build

  docs-build:
    name: Documentation Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install documentation dependencies
        run: cd docs && npm ci

      - name: Typecheck documentation
        run: cd docs && npm run types:check

      - name: Build Next.js documentation site
        run: cd docs && npm run build
